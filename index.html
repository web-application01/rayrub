<!DOCTYPE html>
<html lang="th" data-theme="light" data-build="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ระบบรายรับและรายจ่ายตัวเอง</title>
  <meta name="description" content="บันทึกรายรับ–รายจ่าย แนบสลิป และดูสรุปยอดรายเดือนได้ในที่เดียว">
  <meta name="theme-color" content="#FBFAF6">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- แอป PWA: ติดตั้งลงหน้าจอโฮมได้ทั้ง Android, iPhone/iPad และคอมพิวเตอร์ -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <!-- เชื่อมต่อเซิร์ฟเวอร์ล่วงหน้า ให้เปิดแอปเร็วขึ้น -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ฟอนต์โหลดแบบไม่บล็อกหน้า: เน็ตช้าหรือออฟไลน์ แอปก็ยังเปิดได้ทันที -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style id="shell-css">
    /* สไตล์ของเปลือกแอป (ใช้ก่อนโค้ดหน้าเว็บหลักโหลดเสร็จ) */
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #FBFAF6; color: #1E2B4A; -webkit-font-smoothing: antialiased; }
    .hidden { display: none !important; }
    .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #FBFAF6; z-index: 50; }
    .splash-in { text-align: center; color: #5F6B85; padding: 16px; }
    .splash-logo { width: 88px; height: 88px; border-radius: 24px; display: block; margin: 0 auto 18px; box-shadow: 0 16px 30px -16px rgba(75, 79, 214, .7); }
    .spinner { width: 40px; height: 40px; border: 4px solid #F0EEF8; border-top-color: #4B4FD6; border-radius: 50%; animation: rr-spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes rr-spin { to { transform: rotate(360deg); } }
    .shell-card { max-width: 460px; margin: 16px; padding: 24px; border-radius: 22px; background: #fff; box-shadow: 0 14px 34px -16px rgba(30, 43, 74, .35); text-align: center; line-height: 1.65; }
    .shell-card h2 { margin: 6px 0 4px; font-size: 1.25rem; }
    .shell-card p { margin: 0 0 8px; color: #5F6B85; }
    .shell-card .big { font-size: 2.4rem; line-height: 1.2; }
    .shell-card .sbtn { display: inline-flex; align-items: center; gap: 6px; margin: 8px 4px 0; padding: 11px 18px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; background: #4B4FD6; color: #fff; }
    .shell-card .sbtn.alt { background: #EEF0FF; color: #3A3FB8; }
    .shell-card details { text-align: left; margin-top: 14px; font-size: .88rem; color: #5F6B85; }
    .shell-card summary { cursor: pointer; font-weight: 600; }
    .shell-card ol { padding-left: 20px; margin: 8px 0 0; }
    .shell-card code { background: #F0EEF8; padding: 1px 6px; border-radius: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <!-- ข้อมูลเริ่มต้นจากเซิร์ฟเวอร์ (ตัวโหลดใส่ให้ก่อนเริ่มแอป) -->
  <script type="application/json" id="boot">{}</script>

  <!-- หน้ากำลังโหลด -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-in"><img class="splash-logo" src="icons/icon-192.png" alt="" width="88" height="88"><div class="spinner"></div><p id="shellMsg">กำลังเปิดแอป…</p></div>
  </div>

  <!-- เข้าสู่ระบบ / สมัครสมาชิก / ผู้ดูแลระบบ -->
  <div id="auth" class="auth hidden"></div>

  <!-- แอปหลัก (SPA: เปลี่ยนเฉพาะเนื้อหาใน #main ไม่โหลดหน้าใหม่) -->
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar" aria-label="เมนูหลัก">
      <div id="brand" class="brand"></div>
      <nav id="navList" class="nav"></nav>
      <div id="sideFoot" class="side-foot"></div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="เปิดหรือย่อเมนู" aria-controls="sidebar">☰</button>
        <div class="tb-title">
          <div class="crumb" id="crumb"></div>
          <h1 id="pageTitle" class="page-title"></h1>
        </div>
        <span class="spacer"></span>
        <span class="date-chip" id="dateChip"></span>
        <button type="button" class="user-btn" id="userBtn" aria-label="บัญชีผู้ใช้"></button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
      <footer class="footer" id="footer"></footer>
    </div>

    <nav id="bottomnav" class="bottomnav" aria-label="เมนูด่วน"></nav>
    <button type="button" id="fab" class="fab" aria-label="เพิ่มรายการ"><span>＋</span></button>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <noscript><div class="shell-card" style="margin:40px auto"><h2>ต้องเปิด JavaScript</h2><p>แอปนี้ต้องใช้ JavaScript กรุณาเปิดใช้งานในเบราว์เซอร์ แล้วโหลดหน้าใหม่</p></div></noscript>

  <script src="config.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
